services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้งใน .env}
      # ponytail: ทั้งบ้านอยู่โซนเวลาเดียว current_date จึงยึด Asia/Bangkok ตรงนี้พอ
      # ถ้าวันไหนมีผู้ใช้ต่างโซนเวลา ค่อยเปลี่ยนไปเก็บ tz ต่อ user + at time zone ในคิวรีแทน
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ไม่ publish port ออกมาเลย — เข้าถึงได้จากเครือข่าย compose เท่านั้น
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
      # secure cookie เปิดตามค่านี้ (src/server.ts) — ต้องมี TLS ที่ Caddy ก่อน
      # ไม่มี TLS แล้วตั้ง production = เบราว์เซอร์ทิ้ง cookie ล็อกอินวนไม่จบแบบไม่มี error
      NODE_ENV: production
      PDF_STORAGE_DIR: /app/data/pdf
      TAX_DOC_STORAGE_DIR: /app/data/tax-docs
      # ponytail: เดียวกับ db — ครอบครัวเดียวโซนเวลาเดียวพอ, per-user tz ค่อยทำถ้าจำเป็นจริง
      TZ: Asia/Bangkok
    # ผูกกับ loopback เท่านั้น — iptables ของ Docker ข้าม UFW ถ้าเผลอ publish 0.0.0.0 จะเปิดสู่อินเทอร์เน็ต
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./data/pdf:/app/data/pdf
      - ./data/tax-docs:/app/data/tax-docs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
